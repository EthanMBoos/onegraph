[project]
name = "onegraph"
version = "0.1.0"
description = "One factor graph for estimation and planning, compared with the separate design"
readme = "README.md"
authors = [
    { name = "Ethan Boos", email = "moosboos1@gmail.com" }
]
requires-python = "==3.12.*"
dependencies = [
    "gtsam==4.3.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
]

[project.scripts]
onegraph = "onegraph.experiment:main"

[project.optional-dependencies]
drone = [
    "rotorpy>=3.0.0",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
